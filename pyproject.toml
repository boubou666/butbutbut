[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "butbutbut"
version = "1.1.0"
description = "Un but en Ligue 1, Premier League, LaLiga, Serie A ou Bundesliga : le son part et le score s'affiche sur ton ecran."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["football", "soccer", "livescore", "ligue1", "premier-league", "desktop", "overlay"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
butbutbut = "butbutbut.cli:main"
but = "butbutbut.cli:main"

[project.urls]
Homepage = "https://github.com/boubou666/butbutbut"
Issues = "https://github.com/boubou666/butbutbut/issues"

[tool.setuptools]
packages = ["butbutbut"]

[tool.setuptools.package-data]
butbutbut = ["assets/*"]
