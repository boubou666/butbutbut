name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ce sont les deux bouts qui comptent : 3.8 tient le plancher annonce
        # par `requires-python`, et 3.14 est celle sur laquelle le depot
        # s'ecrit tous les jours - la seule qui manquait, donc la seule dont
        # une rupture serait passee inapercue jusqu'a un rapport d'utilisateur.
        # Entre les deux, deux versions suffisent : ce qui casse d'une version
        # a l'autre en bibliotheque standard casse rarement au milieu seul.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13", "3.14"]
        include:
          # Le plancher ne passe que sous Linux. Ce qu'on lui demande de
          # prouver, c'est que le code se lit encore en 3.8 - pas que les trois
          # systemes divergent a cette version-la plutot qu'aux autres.
          - os: ubuntu-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4

      - name: installer uv et Python ${{ matrix.python }}
        # uv telecharge l'interpreteur au lieu de dependre de ce que le runner
        # embarque, ce qui rend 3.8 eprouvable a nouveau : les images GitHub ne
        # le fournissent plus.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}

      # Les tests ne demandent ni ecran ni reseau, mais on installe tk pour
      # que l'import de tkinter soit couvert la ou c'est un paquet a part.
      - name: tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: compilation
        run: uv run --no-project python -m compileall -q butbutbut tests tools

      - name: tests
        shell: bash
        run: PYTHONPATH=".:tests" uv run --no-project --with "desktop-overlay @ git+https://github.com/boubou666/desktop-overlay.git@v0.2.0" python -m unittest discover -s tests -v

      - name: la ligne de commande repond
        shell: bash
        run: |
          uv run --no-project --with "desktop-overlay @ git+https://github.com/boubou666/desktop-overlay.git@v0.2.0" python -m butbutbut --version
          uv run --no-project --with "desktop-overlay @ git+https://github.com/boubou666/desktop-overlay.git@v0.2.0" python -m butbutbut --paths
          uv run --no-project --with "desktop-overlay @ git+https://github.com/boubou666/desktop-overlay.git@v0.2.0" python -m butbutbut --screens
          uv run --no-project --with "desktop-overlay @ git+https://github.com/boubou666/desktop-overlay.git@v0.2.0" python -m butbutbut --help > /dev/null

  build:
    name: paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: installer uv et Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv build
      - name: le son est bien dans le paquet
        run: |
          uv run --no-project python -m zipfile -l dist/*.whl | grep -q 'butbutbut/assets/but.mp3'
      - uses: actions/upload-artifact@v4
        with:
          name: butbutbut-dist
          path: dist/

  shellcheck:
    name: scripts shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh uninstall.sh
