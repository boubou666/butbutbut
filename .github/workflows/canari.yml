name: canari

# Le seul workflow du depot qui parle au reseau, et il est seul expres.
#
# butbutbut lit une API publique mais non documentee : le jour ou ESPN renomme
# une cle, rien ne casse - le daemon cesse simplement d'annoncer quelque chose.
# Ce rendez-vous quotidien va poser la question a la source elle-meme.
#
# Ni push ni pull_request, jamais : `ci.yml` doit rester hors reseau et
# deterministe. Sans quoi une panne d'ESPN, ou un dimanche sans match,
# repeindrait en rouge des changements qui n'y sont pour rien - et on
# apprendrait vite a ignorer le rouge.
on:
  schedule:
    - cron: "23 6 * * *"      # tous les jours, 6h23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # pour que l'alerte se voie ailleurs que dans un onglet

jobs:
  forme:
    name: la source a-t-elle bouge ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: canari
        id: canari
        shell: bash
        run: python tools/canari.py | tee canari.txt

      # Le rapport reste consultable meme quand tout va bien : c'est lui qui
      # dit ce qui a ete verifie, et ce qui ne l'a pas ete faute de match.
      - name: garder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canari
          path: canari.txt

      # Une croix rouge dans l'onglet Actions, personne ne la regarde. Une
      # issue, si. Une seule est ouverte : les jours suivants viennent s'y
      # ajouter en commentaire plutot que d'en creer une par matin.
      - name: ouvrir l'alerte
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Le canari est rouge : la source a change de forme"
        run: |
          body="$(printf 'Le canari du %s a trouve une derive.\n\n```\n%s\n```\n\nLe run : %s/%s/actions/runs/%s\n\nQuoi faire : le rapport nomme la cle et ce qui etait attendu. Ce qui la lit vit dans `butbutbut/espn.py`.\n' \
            "$(date -u '+%Y-%m-%d')" "$(tail -n 60 canari.txt)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" \
                    --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
