name: pypi

# Le rattrapage manuel : envoyer sur PyPI les paquets d'une release DEJA
# publiee. Rien n'est reconstruit ici, ce qui part est exactement le wheel et
# le sdist qu'on peut telecharger depuis la release.
#
# La publication normale, elle, est le second job de `release.yml` : elle part
# avec le tag. Ce workflow-ci sert quand elle a ete sautee - variable pas
# encore armee au moment du tag, panne de PyPI, jeton OIDC refuse.
#
# Il n'a volontairement PAS de declencheur `release: published` : un evenement
# produit par le GITHUB_TOKEN ne declenche aucun autre workflow, donc ce
# declencheur-la ne se serait jamais produit. Promettre un automatisme qui
# n'existe pas est pire que de ne rien promettre.
#
# A savoir : un publisher de confiance PyPI est lie a UN nom de fichier de
# workflow. Celui que le README fait declarer autorise `release.yml` ; ce
# workflow-ci a donc besoin de son propre publisher (meme valeurs, workflow
# `pypi.yml`) pour que l'echange OIDC passe.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'une release deja publiee (ex. v1.2.0)"
        required: true

permissions: {}

jobs:
  pypi:
    name: publication sur PyPI
    # L'interrupteur. Tant que le proprietaire du depot n'a pas declare le
    # publisher de confiance sur pypi.org puis cree cette variable, le job
    # est saute - il n'echoue pas, et la release GitHub reste verte.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/butbutbut

    permissions:
      contents: read     # lire les pieces jointes de la release
      id-token: write    # obligatoire : c'est le jeton OIDC que PyPI verifie

    steps:
      - name: les paquets de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist
          ls -l dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Un dernier filet : des metadonnees illisibles par PyPI seraient
      # refusees a l'envoi, autant s'en apercevoir avant.
      - name: les metadonnees sont lisibles par PyPI
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # Trusted Publishing : aucun jeton dans le depot, l'action echange le
      # jeton OIDC de ce job contre un jeton d'envoi a usage unique.
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
