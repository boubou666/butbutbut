name: release

# Se declenche sur un tag de version : `git tag -a v1.2.3 && git push --tags`.
#
# La release creee ici declenche a son tour `pypi.yml`, qui envoie les memes
# fichiers sur PyPI - mais seulement une fois que le proprietaire du depot a
# arme la publication (README, section "Publication sur PyPI"). Tant que ce
# n'est pas fait, ce workflow-ci se comporte exactement comme avant.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # v1.2.3-rc1, v1.2.3-beta...
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publier (ex. v1.0.1)"
        required: true

permissions:
  contents: write        # necessaire pour creer la release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: version du tag
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}"     >> "$GITHUB_OUTPUT"

      # Un tag qui ne correspond pas a __version__ produirait une release
      # mensongere : on refuse tout de suite.
      - name: le tag correspond a la version du paquet
        run: |
          declared=$(python -c 'import butbutbut; print(butbutbut.__version__)')
          echo "tag=${{ steps.version.outputs.number }}  paquet=$declared"
          test "$declared" = "${{ steps.version.outputs.number }}"

      - name: tests
        run: PYTHONPATH=".:tests" python -m unittest discover -s tests

      - name: paquet
        run: |
          python -m pip install --upgrade build
          python -m build

      # Les notes sont la section correspondante du CHANGELOG, telle quelle.
      - name: notes de version depuis le CHANGELOG
        id: notes
        run: |
          python - <<'PY' > release-notes.md
          import os
          import re

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()

          # De "## [1.0.1]" jusqu'au prochain "## [" (ou la fin du fichier).
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL)
          found = pattern.search(text)
          body = found.group(1).strip() if found else ""

          if not body:
              body = ("Cette version n'a pas de section dans le CHANGELOG. "
                      "Voir l'historique des commits.")
          print(body)
          PY
          echo "--- notes generees ---"
          cat release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.number }}

      - name: la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: butbutbut ${{ steps.version.outputs.number }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
